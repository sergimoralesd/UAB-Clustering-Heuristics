[package]
name = "change_heuristics"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitcoin = { version = "0.29", features = ["serde"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
hex = "0.4"

[lib]
name = "change_heuristics"
crate-type = ["cdylib", "rlib"]
