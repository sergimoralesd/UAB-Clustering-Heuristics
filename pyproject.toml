[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uab_heuristics"
version = "0.1.0"
description = "Tools for clustering addresses in Bitcoin including heuristics and address normalization."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "python-bitcointx",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "maturin"
]